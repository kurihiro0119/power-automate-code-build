# Power Apps ソースコード (pa.yaml v3)。書き方: docs/app-authoring.md
Screens:
  HomeScreen:
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
    Children:
      - TitleLabel:
          Control: Label
          Properties:
            Text: ="こんにちは Power Apps"
            FontWeight: =FontWeight.Bold
            Size: =24
            Color: =RGBA(32, 31, 30, 1)
            X: =40
            Y: =40
            Width: =Parent.Width - 80
            Height: =60
      - NameInput:
          Control: Classic/TextInput
          Properties:
            Default: =""
            HintText: ="名前を入力"
            X: =40
            Y: =130
            Width: =Min(400, Parent.Width - 80)
            Height: =48
      - GreetButton:
          Control: Classic/Button
          Properties:
            Text: ="あいさつする"
            OnSelect: =Set(varGreeting, "こんにちは、" & Coalesce(NameInput.Text, "ゲスト") & " さん")
            X: =40
            Y: =200
            Width: =200
            Height: =48
      - GreetingLabel:
          Control: Label
          Properties:
            Text: =varGreeting
            Size: =18
            X: =40
            Y: =270
            Width: =Parent.Width - 80
            Height: =48
